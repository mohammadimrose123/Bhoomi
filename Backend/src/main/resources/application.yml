spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bhoomi-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/${DB_NAME:bhoomi_db}}
    username: ${DB_USER:bhoomi_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

bhoomi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:bhoomi}
    jwt-expiration: ${JWT_EXPIRATION:PT1H}
    password-reset-expiration: ${PASSWORD_RESET_EXPIRATION:PT15M}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  email:
    enabled: ${BHOOMI_EMAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@bhoomi.local}
  documents:
    storage-path: ${BHOOMI_DOCUMENT_STORAGE_PATH:./var/private-documents}

logging:
  level:
    com.bhoomi: INFO
  structured:
    format:
      console: ecs
